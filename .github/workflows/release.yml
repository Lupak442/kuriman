name: Build and Release Windows App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: pkg
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $ver = $pkg.version
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "tag=v$ver" >> $env:GITHUB_OUTPUT

      - name: Check if release already exists
        id: check_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.pkg.outputs.tag }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0 -and "${{ github.event_name }}" -ne "workflow_dispatch") {
            echo "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release $tag already exists. Skipping build."
          } else {
            echo "exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "Ready to build and publish $tag."
          }
          exit 0

      - name: Setup Node.js
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        if: steps.check_release.outputs.exists == 'false'
        run: npm ci

      - name: Build Windows Installer
        if: steps.check_release.outputs.exists == 'false'
        run: npx electron-builder --win nsis --publish never

      - name: Publish GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.pkg.outputs.tag }}"
          $files = @()
          $files += Get-ChildItem -Path dist -Filter "*.exe" | Select-Object -ExpandProperty FullName
          $files += Get-ChildItem -Path dist -Filter "*.blockmap" | Select-Object -ExpandProperty FullName
          if (Test-Path "dist/latest.yml") {
            $files += (Resolve-Path "dist/latest.yml").Path
          }
          if ($files.Count -eq 0) {
            Write-Error "No build artifacts found in dist/"
            exit 1
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title $tag --generate-notes
          }
