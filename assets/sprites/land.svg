<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <clipPath id="headClip">
      <ellipse cx="70" cy="66" rx="44" ry="39"/>
    </clipPath>
    <clipPath id="squishClip">
      <ellipse cx="70" cy="76" rx="50" ry="32"/>
    </clipPath>
    <linearGradient id="chestnutGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B3710"/>
      <stop offset="65%" stop-color="#8A4B19"/>
      <stop offset="100%" stop-color="#9B5722"/>
    </linearGradient>
  </defs>
  <g filter="url(#shadow)">
    
    <!-- Impact dust puffs -->
    <circle cx="22" cy="124" r="6" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="118" cy="124" r="6" fill="#FFFFFF" opacity="0.8"/>
    <!-- Squished feet -->
    <ellipse cx="48" cy="126" rx="11" ry="5" fill="#FFF7DF" stroke="#3B2314" stroke-width="3"/>
    <ellipse cx="92" cy="126" rx="11" ry="5" fill="#FFF7DF" stroke="#3B2314" stroke-width="3"/>
    <!-- Squished Wide Body -->
    <ellipse cx="70" cy="110" rx="34" ry="17" fill="#FFF7DF" stroke="#3B2314" stroke-width="3"/>
    <!-- Arms out -->
    <ellipse cx="34" cy="108" rx="11" ry="7" transform="rotate(-15 34 108)" fill="#FFF7DF" stroke="#3B2314" stroke-width="3"/>
    <ellipse cx="106" cy="108" rx="11" ry="7" transform="rotate(15 106 108)" fill="#FFF7DF" stroke="#3B2314" stroke-width="3"/>
    
    <!-- Ears -->
    <circle cx="37" cy="50" r="11" fill="#FFF7DF" stroke="#3B2314" stroke-width="3"/>
    <circle cx="37" cy="50" r="5.5" fill="#F5D5B8"/>
    <circle cx="103" cy="50" r="11" fill="#FFF7DF" stroke="#3B2314" stroke-width="3"/>
    <circle cx="103" cy="50" r="5.5" fill="#F5D5B8"/>
    <!-- Main Head Base -->
    <ellipse cx="70" cy="76" rx="50" ry="32" fill="#FFF7DF" stroke="#3B2314" stroke-width="3"/>
    <!-- Chestnut Brown Top (Kurimanju signature) -->
    <g clip-path="url(#squishClip)">
      <ellipse cx="70" cy="53" rx="54" ry="26" fill="url(#chestnutGrad)"/>
      <!-- Gloss on chestnut top -->
      <ellipse cx="58" cy="45" rx="14" ry="5" fill="#FFFFFF" opacity="0.28" transform="rotate(-10 58 45)"/>
    </g>
    <!-- Re-stroke head outline cleanly -->
    <ellipse cx="70" cy="76" rx="50" ry="32" fill="none" stroke="#3B2314" stroke-width="3"/>
  
    
    <!-- Blush -->
    <ellipse cx="46" cy="86" rx="7.5" ry="4.5" fill="#FF9E9E" opacity="0.75"/>
    <ellipse cx="94" cy="86" rx="7.5" ry="4.5" fill="#FF9E9E" opacity="0.75"/>
    <!-- Eyes -->
    <circle cx="56" cy="79" r="4.2" fill="#2B1810"/>
    <circle cx="54.5" cy="77.5" r="1.4" fill="#FFFFFF"/>
    <circle cx="84" cy="79" r="4.2" fill="#2B1810"/>
    <circle cx="82.5" cy="77.5" r="1.4" fill="#FFFFFF"/>
    <!-- Under-eye cute lines -->
    <path d="M 53 86 Q 56 87.5 59 86" fill="none" stroke="#3B2314" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 81 86 Q 84 87.5 87 86" fill="none" stroke="#3B2314" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Mouth (ω) -->
    <path d="M 64 86 Q 67 90 70 86.5 Q 73 90 76 86" fill="none" stroke="#3B2314" stroke-width="2.3" stroke-linecap="round"/>
  
  
  </g>
</svg>