<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <clipPath id="headClip">
      <ellipse cx="70" cy="66" rx="44" ry="39"/>
    </clipPath>
    <clipPath id="squishClip">
      <ellipse cx="70" cy="76" rx="50" ry="32"/>
    </clipPath>
    <linearGradient id="chestnutGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B3710"/>
      <stop offset="65%" stop-color="#8A4B19"/>
      <stop offset="100%" stop-color="#9B5722"/>
    </linearGradient>
  </defs>
  <g filter="url(#shadow)">
    
    <!-- Arms holding ceiling opposite -->
    <ellipse cx="46" cy="28" rx="8" ry="13" transform="rotate(10 46 28)" fill="#FFF7DF" stroke="#3B2314" stroke-width="3"/>
    <ellipse cx="94" cy="24" rx="8" ry="13" transform="rotate(-10 94 24)" fill="#FFF7DF" stroke="#3B2314" stroke-width="3"/>
    <!-- Feet dangling -->
    <ellipse cx="55" cy="123" rx="9" ry="6" transform="rotate(-15 55 123)" fill="#FFF7DF" stroke="#3B2314" stroke-width="3"/>
    <ellipse cx="85" cy="126" rx="9" ry="6" transform="rotate(15 85 126)" fill="#FFF7DF" stroke="#3B2314" stroke-width="3"/>
    <!-- Body -->
    <ellipse cx="70" cy="104" rx="27" ry="22" fill="#FFF7DF" stroke="#3B2314" stroke-width="3"/>
    
    <!-- Ears -->
    <circle cx="37" cy="40" r="11" fill="#FFF7DF" stroke="#3B2314" stroke-width="3"/>
    <circle cx="37" cy="40" r="5.5" fill="#F5D5B8"/>
    <circle cx="103" cy="40" r="11" fill="#FFF7DF" stroke="#3B2314" stroke-width="3"/>
    <circle cx="103" cy="40" r="5.5" fill="#F5D5B8"/>
    <!-- Main Head Base -->
    <ellipse cx="70" cy="66" rx="44" ry="39" fill="#FFF7DF" stroke="#3B2314" stroke-width="3"/>
    <!-- Chestnut Brown Top (Kurimanju signature) -->
    <g clip-path="url(#headClip)">
      <ellipse cx="70" cy="43" rx="48" ry="26" fill="url(#chestnutGrad)"/>
      <!-- Gloss on chestnut top -->
      <ellipse cx="58" cy="35" rx="14" ry="5" fill="#FFFFFF" opacity="0.28" transform="rotate(-10 58 35)"/>
    </g>
    <!-- Re-stroke head outline cleanly -->
    <ellipse cx="70" cy="66" rx="44" ry="39" fill="none" stroke="#3B2314" stroke-width="3"/>
  
    
    <!-- Blush -->
    <ellipse cx="46" cy="75" rx="7.5" ry="4.5" fill="#FF9E9E" opacity="0.75"/>
    <ellipse cx="94" cy="75" rx="7.5" ry="4.5" fill="#FF9E9E" opacity="0.75"/>
    <!-- Eyes -->
    <circle cx="56" cy="68" r="4.2" fill="#2B1810"/>
    <circle cx="54.5" cy="66.5" r="1.4" fill="#FFFFFF"/>
    <circle cx="84" cy="68" r="4.2" fill="#2B1810"/>
    <circle cx="82.5" cy="66.5" r="1.4" fill="#FFFFFF"/>
    <!-- Under-eye cute lines -->
    <path d="M 53 75 Q 56 76.5 59 75" fill="none" stroke="#3B2314" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 81 75 Q 84 76.5 87 75" fill="none" stroke="#3B2314" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Mouth (ω) -->
    <path d="M 64 75 Q 67 79 70 75.5 Q 73 79 76 75" fill="none" stroke="#3B2314" stroke-width="2.3" stroke-linecap="round"/>
  
  
  </g>
</svg>